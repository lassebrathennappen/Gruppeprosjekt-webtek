<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Gjør at spesielle tegn og bokstaver vises på nettsiden istedenfor errors-->
    <meta charset="UTF-8">
    <!-- Tilpasser nettsiden til forskjellige enheter-->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reservations – OPA!</title>
    <!-- Beskrivelse under nettsiden på google -->
    <meta name="description" content="Book a table at OPA!, a Greek restaurant in Trondheim city centre.">
    <!-- Link til stylingen-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Erica+One&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="scripts/reservations.js" defer></script>
</head>
<body>
    <header>
        <!-- Navbar-->
        <a href="index.html" class="logo">OPA!</a>
        <nav>
            <ul>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="about-us.html">About us</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="reservations.html" class="nav-button" aria-current="page">Reservations</a></li>
            </ul>
        </nav>
    <!-- Gir teksten som lese opp av skjermleser -->
    </header>
    <main class="reservation">
        <h1 class="visually-hidden">Book a table at OPA!</h1>
 
        <!-- Venstre kolonne: det brukeren har valgt så langt -->
        <aside class="summary" id="summary" aria-label="Your booking so far" hidden>
 
            <div class="summary-box" id="summary-guests" hidden>
                <span class="summary-label">Guests</span>
                <span class="summary-value" id="value-guests"></span>
                <button type="button" class="edit-btn" data-step="guests" aria-label="Change number of guests">
                    <svg width="34" height="34" viewBox="0 0 1024 1024" aria-hidden="true"><path fill="currentColor" d="M880 836H144c-17.7 0-32 14.3-32 32v36c0 4.4 3.6 8 8 8h784c4.4 0 8-3.6 8-8v-36c0-17.7-14.3-32-32-32m-622.3-84c2 0 4-.2 6-.5L431.9 722c2-.4 3.9-1.3 5.3-2.8l423.9-423.9a9.96 9.96 0 0 0 0-14.1L694.9 114.9c-1.9-1.9-4.4-2.9-7.1-2.9s-5.2 1-7.1 2.9L256.8 538.8c-1.5 1.5-2.4 3.3-2.8 5.3l-29.5 168.2a33.5 33.5 0 0 0 9.4 29.8c6.6 6.4 14.9 9.9 23.8 9.9"/></svg>
                </button>
            </div>
 
            <div class="summary-box" id="summary-date" hidden>
                <span class="summary-label">Date</span>
                <span class="summary-value" id="value-date"></span>
                <button type="button" class="edit-btn" data-step="date" aria-label="Change date">
                    <svg width="34" height="34" viewBox="0 0 1024 1024" aria-hidden="true"><path fill="currentColor" d="M880 836H144c-17.7 0-32 14.3-32 32v36c0 4.4 3.6 8 8 8h784c4.4 0 8-3.6 8-8v-36c0-17.7-14.3-32-32-32m-622.3-84c2 0 4-.2 6-.5L431.9 722c2-.4 3.9-1.3 5.3-2.8l423.9-423.9a9.96 9.96 0 0 0 0-14.1L694.9 114.9c-1.9-1.9-4.4-2.9-7.1-2.9s-5.2 1-7.1 2.9L256.8 538.8c-1.5 1.5-2.4 3.3-2.8 5.3l-29.5 168.2a33.5 33.5 0 0 0 9.4 29.8c6.6 6.4 14.9 9.9 23.8 9.9"/></svg>
                </button>
            </div>
 
            <div class="summary-box" id="summary-time" hidden>
                <span class="summary-label">Time</span>
                <span class="summary-value" id="value-time"></span>
                <button type="button" class="edit-btn" data-step="time" aria-label="Change time">
                    <svg width="34" height="34" viewBox="0 0 1024 1024" aria-hidden="true"><path fill="currentColor" d="M880 836H144c-17.7 0-32 14.3-32 32v36c0 4.4 3.6 8 8 8h784c4.4 0 8-3.6 8-8v-36c0-17.7-14.3-32-32-32m-622.3-84c2 0 4-.2 6-.5L431.9 722c2-.4 3.9-1.3 5.3-2.8l423.9-423.9a9.96 9.96 0 0 0 0-14.1L694.9 114.9c-1.9-1.9-4.4-2.9-7.1-2.9s-5.2 1-7.1 2.9L256.8 538.8c-1.5 1.5-2.4 3.3-2.8 5.3l-29.5 168.2a33.5 33.5 0 0 0 9.4 29.8c6.6 6.4 14.9 9.9 23.8 9.9"/></svg>
                </button>
            </div>
        </aside>
 
        <!-- Steg 1: Antall gjester -->
        <section class="step" id="step-guests">
            <div class="card">
                <h2 tabindex="-1">How many people?</h2>
                <div class="guest-grid">
                    <button type="button" class="guest-btn" data-guests="1" aria-pressed="false">1</button>
                    <button type="button" class="guest-btn" data-guests="2" aria-pressed="false">2</button>
                    <button type="button" class="guest-btn" data-guests="3" aria-pressed="false">3</button>
                    <button type="button" class="guest-btn" data-guests="4" aria-pressed="false">4</button>
                    <button type="button" class="guest-btn" data-guests="5" aria-pressed="false">5</button>
                    <button type="button" class="guest-btn" data-guests="6" aria-pressed="false">6</button>
                    <button type="button" class="guest-btn" data-guests="7" aria-pressed="false">7</button>
                    <button type="button" class="guest-btn" data-guests="8" aria-pressed="false">8</button>
                </div>
            </div>
            <button type="button" class="next-btn" id="next-guests" hidden>Next</button>
        </section>
 
        <!-- Steg 2: Dato -->
        <section class="step" id="step-date" hidden>
            <div class="card">
                <h2 tabindex="-1">Pick a date</h2>
                <!-- Dynamisk kalender (fylles inn med JavaScript) -->
                <p class="month-name" id="month-name"></p>
                <div class="calendar-row">
                    <button type="button" class="arrow-btn" id="prev-month" aria-label="Previous month">&#8249;</button>
                    <div class="calendar-grid" id="calendar-grid"></div>
                    <button type="button" class="arrow-btn" id="next-month" aria-label="Next month">&#8250;</button>
                </div>
            </div>
            <button type="button" class="next-btn" id="next-date" hidden>Next</button>
        </section>
 
        <!-- Steg 3: Tidspunkt -->
        <section class="step" id="step-time" hidden>
            <div class="card">
                <h2 tabindex="-1">Pick a time</h2>
                <div class="time-grid" id="time-grid"></div>
            </div>
            <button type="button" class="next-btn" id="next-time" hidden>Next</button>
        </section>
 
        <!-- Steg 4: Kontaktinfo -->
        <section class="step" id="step-contact" hidden>
            <form id="contact-form" class="contact-form" novalidate>
                <div class="card card-form">
                    <h2 tabindex="-1">Fill out contact info</h2>
 
                    <label for="email">Email<span class="star" aria-hidden="true">*</span></label>
                    <input type="email" id="email" name="email" placeholder="example@gmail.com" aria-describedby="email-error">
                    <!-- Feilmelding vises her av JavaScript -->
                    <p class="error-text" id="email-error" role="alert" hidden></p>
 
                    <label for="first-name">Name<span class="star" aria-hidden="true">*</span></label>
                    <input type="text" id="first-name" name="first-name" placeholder="Name" aria-describedby="first-name-error">
                    <p class="error-text" id="first-name-error" role="alert" hidden></p>
 
                    <label for="last-name">Lastname</label>
                    <input type="text" id="last-name" name="last-name" placeholder="Lastname">
 
                    <label for="comments">Comments</label>
                    <input type="text" id="comments" name="comments" placeholder="Add comments to the booking">
 
                    <p class="required-text">*Required</p>
                </div>
                <button type="submit" class="next-btn">Next</button>
            </form>
        </section>
 
        <!-- Steg 5: Takk for bestillingen -->
        <section class="step" id="step-thanks" hidden>
            <div class="card card-wide">
                <h2 tabindex="-1">Thank you for your booking!</h2>
                <p class="thanks-text">
                    We are excited to have you at OPA!<br>
                    Booking details are sent to <strong id="thanks-email"></strong>
                </p>
            </div>
        </section>
    </main>
</body>
</html>

</html>
