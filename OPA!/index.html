    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OPA! – Greek restaurant in Trondheim</title>
    <!-- Beskrivelse under nettsiden på google -->
    <meta name="description" content="OPA! is a Greek restaurant in Trondheim serving traditional food with a modern twist. See the menu and book a table.">
    <!-- Link til stylingen-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Erica+One&family=Inter:wght@400;700&display=swap" rel="stylesheet">

<body>
    <header>
        <!-- Navbar-->
        <a href="index.html" class="logo">OPA!</a>
        <nav>
            <ul>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="about-us.html">About us</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="reservations.html" class="nav-button">Reservations</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- an old story served differently -->
        <section class="banner">
            <h1>An old story, served differently.</h1>
        </section>

        <section class="welcome">
            <div class="welcome-text">

                <p>Traditional Greek food with a modern twist.</p>
            </div>
            <img src= "images/food5.jpg" alt=" Greek meze on a table with a white tablecloth: bread topped with tomato and feta, a creamy dip on a copper plate, grilled vegetables with caper berries and olives, a salad with lemon, and stuffed vine leaves in olive oil. Bright, sun-washed and generous, like lunch on a Greek island.">
       <!--grundig beskrivelse for skjermleser-->
        </section>

        <div class="divider" aria-hidden="true">
        </div>

        <section class="location">

            <div class="location-text">
                <h2>Located in Trondheim city centre.</h2>
                <address>
                    <a href="https://maps.google.com/?q=Munkegata+1,+7011+Trondheim">Munkegata 1, 7011 Trondheim </a>
                </address>
                <a href="reservations.html" class="pillbutton primary">RESERVE A TABLE</a>
                <a href="menu.html" class="pillbutton secondary">MENU</a>
                <a href="events.html" class="pillbutton secondary">EVENTS</a>
                <a href="contact.html" class="pillbutton secondary">CONTACT US</a>
